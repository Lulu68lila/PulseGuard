[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard"
version = "0.1.0"
description = "PulseGuard — High-Performance Antivirus Engine, Real-time Watcher, and Quarantine Vault"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PulseGuard Team" }
]
dependencies = [
    "watchdog>=6.0.0",
    "cryptography>=42.0.0",
    "pefile>=2024.8.26",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pulseguard = "pulseguard.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
